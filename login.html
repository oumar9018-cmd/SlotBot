<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — SlotTutor</title>
<meta name="description" content="Log in to SlotTutor with your Google account.">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="./assets/style.css">
<!-- Firebase (compat) — TODO: replace placeholder config with real Firebase project config -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script>
/* TODO: paste your Firebase web app config here (console.firebase.google.com → Project settings) */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};
let fbAuth = null;
try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    fbAuth = firebase.auth();
  }
} catch(e){ console.warn("Firebase init skipped:", e.message); }
</script>
</head>
<body>
<div class="login-wrap">
  <div class="glass login-card">
    <a class="logo" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="#2481cc" stroke-width="2" width="34" height="34"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></a>
    <h1>Welcome back</h1>
    <p>Log in to manage your bookings, availability and earnings.</p>
    <button class="gbtn" id="glogin">
      <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.3h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2 3.8-5 3.8-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.1 0-5.8-2.1-6.8-5l-.1.1-3.6 2.8-.1.1C3.5 21.3 7.4 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.6-2.8-.1.1C.5 8.5 0 10.1 0 12s.5 3.5 1.4 5.2l3.8-2.8z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.4 0 3.5 2.7 1.4 6.8l3.8 2.9c1-2.9 3.7-5 6.8-5z"/></svg>
      Continue with Google
    </button>
    <div id="login-err"></div>
    <p class="login-note">New here? <a href="./login.html" style="font-weight:700">Create a free account</a> — same button, 30 seconds.</p>
    <p class="login-note" style="margin-top:8px"><a href="./">← Back to home</a></p>
  </div>
</div>
<script>
document.getElementById("glogin").addEventListener("click", async ()=>{
  const err = document.getElementById("login-err");
  if(!fbAuth){
    err.style.display="block";
    err.textContent="Google login is being connected — check back soon! (Firebase config pending)";
    return;
  }
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await fbAuth.signInWithPopup(provider);
    location.href="./app.html";
  }catch(e){
    err.style.display="block";
    err.textContent="Login failed: "+e.message;
  }
});
</script>
</body>
</html>
