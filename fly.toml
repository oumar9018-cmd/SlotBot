# Fly.io deployment (recommended zero-cost option: persistent volume for SQLite)
app = "slotbot"
primary_region = "bom"   # Mumbai — close to initial tutor base

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep running so reminders fire on time
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "slotbot_data"
  destination = "/data"

[env]
  DB_PATH = "/data/slotbot.db"
  LOG_LEVEL = "INFO"
