<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SlotBot Dashboard (Preview)</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--tg-theme-bg-color, #fff);
         color: var(--tg-theme-text-color, #000); padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: var(--tg-theme-hint-color, #888); font-size: 13px; margin-bottom: 16px; }
  .card { background: var(--tg-theme-secondary-bg-color, #f4f4f5); border-radius: 12px;
          padding: 14px; margin-bottom: 12px; }
  .card .big { font-size: 26px; font-weight: 700; }
  .card .lbl { font-size: 12px; color: var(--tg-theme-hint-color, #888); }
  .booking { display: flex; justify-content: space-between; align-items: center;
             padding: 10px 0; border-bottom: 1px solid var(--tg-theme-hint-color, #eee); }
  .booking:last-child { border-bottom: none; }
  .booking .who { font-weight: 600; }
  .booking .when { font-size: 13px; color: var(--tg-theme-hint-color, #888); }
  .link { word-break: break-all; font-size: 13px; color: var(--tg-theme-link-color, #2481cc); }
  .empty { text-align: center; color: var(--tg-theme-hint-color, #888); padding: 24px 0; }
  .preview-banner { background: #fff3cd; color: #856404; font-size: 12px; text-align: center;
                    padding: 8px; border-radius: 8px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="preview-banner">👀 Preview with your real data — live version connects via bot</div>
<div id="app">
  <h1 id="tname">Hi, Pepe 👋</h1>
  <div class="sub" id="ttz">Asia/Kolkata • 6 ⭐ / session</div>

  <div class="card"><div class="lbl">Total earnings</div><div class="big" id="earn">6 ⭐ (~$0.09)</div></div>
  <div class="card"><div class="lbl">Upcoming bookings</div><div class="big" id="bcount">1</div></div>

  <h1 style="font-size:16px; margin: 16px 0 8px;">Upcoming</h1>
  <div class="card" id="blist">
    <div class="booking">
      <div><div class="who">👤 Hajan</div><div class="when">Mon 12 Oct, 6:30 PM</div></div>
      <div style="font-size:12px; color:#0a0;">paid ✓</div>
    </div>
  </div>

  <h1 style="font-size:16px; margin: 16px 0 8px;">Your booking link</h1>
  <div class="card"><div class="link" id="blink">https://t.me/Cripercore_bot?start=book_DtAwbex_</div></div>
</div>

<script>
const tg = window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
</script>
</body>
</html>
