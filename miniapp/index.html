<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SlotBot Dashboard</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --glass-bg: rgba(255,255,255,0.55);
    --glass-border: rgba(255,255,255,0.6);
    --glass-shadow: 0 8px 32px rgba(31,38,135,0.12);
    --accent: #2481cc;
    --accent2: #7b61ff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    min-height: 100vh; padding: 20px 16px 40px; color: #1c1c1e;
    background: linear-gradient(135deg, #a8c8ec 0%, #d4b8e8 45%, #f5c8d8 100%);
    background-attachment: fixed;
  }
  /* Header */
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
            animation: fadeDown .5s ease; }
  .avatar { width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; color: #fff; font-weight: 700;
            box-shadow: var(--glass-shadow); flex-shrink: 0; }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .header .sub { font-size: 13px; color: #555; margin-top: 2px; }
  /* Glass card */
  .glass {
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    backdrop-filter: blur(20px) saturate(1.4);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow: var(--glass-shadow);
    padding: 18px;
    margin-bottom: 14px;
    animation: fadeUp .5s ease backwards;
  }
  .glass:nth-child(3) { animation-delay: .08s; }
  .glass:nth-child(4) { animation-delay: .16s; }
  /* Stats grid */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .stat { padding: 16px; text-align: center; animation: fadeUp .5s ease backwards; }
  .stat:nth-child(2) { animation-delay: .08s; }
  .stat .big { font-size: 30px; font-weight: 800; letter-spacing: -0.5px;
               background: linear-gradient(135deg, var(--accent), var(--accent2));
               -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .stat .lbl { font-size: 12px; color: #666; margin-top: 4px; font-weight: 500; }
  /* Section title */
  .sec-title { font-size: 15px; font-weight: 700; margin: 20px 4px 10px; letter-spacing: -0.2px;
               animation: fadeUp .5s ease backwards; animation-delay: .2s; }
  /* Booking rows */
  .booking { display: flex; justify-content: space-between; align-items: center;
             padding: 13px 4px; border-bottom: 1px solid rgba(0,0,0,0.06); }
  .booking:last-child { border-bottom: none; }
  .booking .who { font-weight: 600; font-size: 15px; }
  .booking .when { font-size: 13px; color: #666; margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
           background: rgba(52,199,89,0.15); color: #1a7f37; }
  .empty { text-align: center; color: #666; padding: 28px 10px; font-size: 14px; line-height: 1.6; }
  .empty .big-emoji { font-size: 36px; display: block; margin-bottom: 8px; }
  /* Link box */
  .link-row { display: flex; gap: 8px; align-items: center; }
  .link-text { flex: 1; font-size: 12px; color: var(--accent); word-break: break-all;
               background: rgba(36,129,204,0.08); padding: 10px 12px; border-radius: 12px; }
  .btn { border: none; border-radius: 14px; padding: 12px 18px; font-size: 14px; font-weight: 700;
         cursor: pointer; transition: transform .15s, opacity .15s; }
  .btn:active { transform: scale(.96); opacity: .85; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent2));
                 color: #fff; box-shadow: 0 4px 16px rgba(36,129,204,0.35); }
  .btn-copy { padding: 10px 14px; font-size: 13px; flex-shrink: 0; }
  /* Quick actions */
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .action-btn { padding: 16px 10px; font-size: 13px; font-weight: 600; text-align: center;
                color: #1c1c1e; cursor: pointer; }
  .action-btn .ico { font-size: 24px; display: block; margin-bottom: 6px; }
  /* Error */
  #err { display: none; text-align: center; padding: 40px 20px; color: #666; font-size: 14px; }
  #err .big-emoji { font-size: 44px; display: block; margin-bottom: 12px; }
  /* Animations */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
  /* Toast */
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
           background: rgba(28,28,30,0.9); color: #fff; padding: 12px 22px; border-radius: 30px;
           font-size: 14px; font-weight: 600; opacity: 0; transition: all .3s; pointer-events: none;
           -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); z-index: 99; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="err"><span class="big-emoji">🔗</span><b>Dashboard unavailable</b><br><br>Open this from your bot's Dashboard button<br>so I can verify it's you.</div>

<div id="app" style="display:none">
  <div class="header">
    <div class="avatar" id="avatar">👤</div>
    <div>
      <h1 id="tname">Dashboard</h1>
      <div class="sub" id="ttz"></div>
    </div>
  </div>

  <div class="stats">
    <div class="glass stat"><div class="big" id="earn">–</div><div class="lbl">Total earnings</div></div>
    <div class="glass stat"><div class="big" id="bcount">–</div><div class="lbl">Upcoming bookings</div></div>
  </div>

  <div class="sec-title">📅 Upcoming sessions</div>
  <div class="glass" id="blist" style="padding:6px 18px;"><div class="empty">Loading…</div></div>

  <div class="sec-title">🔗 Your booking link</div>
  <div class="glass">
    <div class="link-row">
      <div class="link-text" id="blink"></div>
      <button class="btn btn-primary btn-copy" id="copybtn">Copy</button>
    </div>
  </div>

  <div class="sec-title">⚡ Quick actions</div>
  <div class="actions">
    <div class="glass action-btn" id="sharebtn"><span class="ico">📤</span>Share link</div>
    <div class="glass action-btn" id="refreshbtn"><span class="ico">🔄</span>Refresh</div>
  </div>
</div>

<div id="toast"></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(path) {
  const headers = {};
  if (tg && tg.initData) headers["X-Init-Data"] = tg.initData;
  const r = await fetch(path, { headers });
  if (!r.ok) throw new Error("auth " + r.status);
  return r.json();
}

function render(me, bk, earn) {
  document.getElementById("tname").textContent = "Hi, " + me.name + " 👋";
  document.getElementById("avatar").textContent = (me.name || "?")[0].toUpperCase();
  document.getElementById("ttz").textContent = me.timezone + "  •  " + me.price_stars + " ⭐ / session";
  document.getElementById("earn").textContent = earn.total_stars + " ⭐";
  document.getElementById("bcount").textContent = bk.bookings.length;

  const bl = document.getElementById("blist");
  if (!bk.bookings.length) {
    bl.innerHTML = '<div class="empty"><span class="big-emoji">🗓️</span>No upcoming bookings yet.<br>Share your link with students!</div>';
  } else {
    bl.innerHTML = "";
    bk.bookings.forEach(b => {
      const d = document.createElement("div");
      d.className = "booking";
      const left = document.createElement("div");
      const who = document.createElement("div"); who.className = "who";
      who.textContent = "👤 " + (b.student || "Student");
      const when = document.createElement("div"); when.className = "when";
      when.textContent = b.label || "";
      left.appendChild(who); left.appendChild(when);
      const badge = document.createElement("div"); badge.className = "badge"; badge.textContent = "✓ paid";
      d.appendChild(left); d.appendChild(badge);
      bl.appendChild(d);
    });
  }

  const link = me.booking_link || "";
  document.getElementById("blink").textContent = link;

  document.getElementById("copybtn").onclick = async () => {
    try { await navigator.clipboard.writeText(link); toast("Link copied! 📋"); }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = link; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("Link copied! 📋"); }
      catch (e2) { toast("Copy manually: " + link); }
      ta.remove();
    }
  };
  document.getElementById("sharebtn").onclick = () => {
    const url = "https://t.me/share/url?url=" + encodeURIComponent(link) +
                "&text=" + encodeURIComponent("Book a session with me! 📚");
    if (tg) tg.openTelegramLink(url); else window.open(url, "_blank");
  };
  document.getElementById("refreshbtn").onclick = () => location.reload();

  document.getElementById("app").style.display = "block";
}

(async () => {
  try {
    const me = await api("/api/me");
    const [bk, earn] = await Promise.all([api("/api/bookings"), api("/api/earnings")]);
    render(me, bk, earn);
  } catch (e) {
    // Demo fallback: show beautiful UI with sample data when no backend
    if (location.hostname.includes("github.io")) {
      render(
        { name: "Pepe", timezone: "Asia/Kolkata", price_stars: 6,
          booking_link: "https://t.me/Cripercore_bot?start=book_DtAwbex_" },
        { bookings: [{ student: "Hajan", label: "Mon 12 Oct, 6:30 PM" }] },
        { total_stars: 6 }
      );
      toast("👀 Preview mode — connect backend for live data");
    } else {
      document.getElementById("err").style.display = "block";
    }
  }
})();
</script>
</body>
</html>
