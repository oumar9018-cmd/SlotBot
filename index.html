  <!-- WORKER 3 (cache-busting, defense-in-depth): ask every cache not to
       store index.html. WebViews routinely IGNORE these meta tags, so
       they are NOT the mechanism — the in-app update check (App.jsx,
       re-fetch ./index.html with a cache-busting query + no-store,
       compare bundle filename) is. These tags cost nothing and help
       where they are honoured. -->

  <meta http-equiv="Pragma" content="no-cache" />

       the browser chrome never flashes white on load. The inline script in
       <body> restores the cream #FFFBF5 theme-color after the splash. -->
  <style>
    /* Pre-paint boot splash: index.css only arrives WITH the JS bundle, so
       without this inline twin the first paint would be a white flash.
       Same design as SplashScreen.jsx (deep-violet brand gradient, Grilly,
       wordmark, tagline, three dots). It HOLDS (no CSS auto-fade) until
       React's SplashScreen removes this node on mount — so on a slow
       bundle there is never a blank gap between boot fade and React
       splash, and the two never stack. Fallbacks (inline script below):
       a 1600ms checkpoint that removes it only once React has mounted,
       and a 15s hard cap that swaps in a load-error state if the bundle
       never mounts. Total choreographed splash budget is 1400ms from
       boot T0 (the React splash plays only the remaining budget after
       boot). */

    body { margin: 0; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;

    .boot-glow-pink { top: -70px; left: -70px; background: #F472B6; }
    .boot-glow-sky { right: -80px; bottom: -60px; background: #38BDF8; }
    .boot-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; padding: 0 32px; }
    .boot-grilly { filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.35)); }
    .boot-word { margin-top: 18px; font-family: "Quicksand", system-ui, sans-serif; font-weight: 800; font-size: 42px; line-height: 1.1; letter-spacing: -0.02em; color: #fff; }
    .boot-word span { color: #FBCFE8; }
    .boot-tag { margin: 10px 0 0; font-family: system-ui, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.45; color: #EDE9FE; }

    /* Boot-load failure state (worker 4): swapped in by the inline script

    .boot-error-title { margin-top: 18px; font-family: "Quicksand", system-ui, sans-serif; font-weight: 800; font-size: 24px; line-height: 1.25; color: #fff; }
    .boot-error-text { margin: 10px 0 0; font-family: system-ui, sans-serif; font-weight: 600; font-size: 15px; line-height: 1.5; color: #EDE9FE; max-width: 320px; }

  <script>
    // WORKER 4 (boot / ready ordering): Telegram helpers, defined BEFORE
    // the telegram-web-app.js tag below so its onerror handler can use
    // them. No auth here — ready() only tells Telegram the app has
    // loaded; it carries no identity and creates no session.
    // __MG_TG_READY_SENT guards our own early ready() posts (Telegram
    // also tolerates repeats; the guard just keeps it to one).
    window.__MG_TG_READY_SENT = false
    window.__MG_TG_SCRIPT_FAILED = false
    window.__MG_signalTgReady = function () {
      try {
        var wa = window.Telegram && window.Telegram.WebApp
        if (wa && !window.__MG_TG_READY_SENT) {
          window.__MG_TG_READY_SENT = true
          wa.ready()
        }
      } catch (e) { /* never throw from the boot path */ }
    }
    // One-time retry if the Telegram CDN script fails to load (CDN
    // blocked / network blip). Without this, window.Telegram stays
    // undefined forever and ready()/BackButton/viewport all silently
    // die — auth would then depend solely on the SDK URL-hash path.
    // The retry is async (dynamic injection) but it only covers the
    // failure case: the primary tag below is synchronous, so in the
    // normal case the script is present before any app code runs.
    window.__MG_TG_RETRIED = false
    window.__MG_retryTgScript = function () {
      try {
        if (window.__MG_TG_RETRIED) return
        window.__MG_TG_RETRIED = true
        var s = document.createElement('script')
        s.src = 'https://telegram.org/js/telegram-web-app.js'
        s.onload = function () { window.__MG_signalTgReady() }
        s.onerror = function () { window.__MG_TG_SCRIPT_FAILED = true }
        document.head.appendChild(s)
      } catch (e) { /* noop */ }
    }
  </script>
  <!-- WORKER 4: NO async/defer on purpose — this tag is parser-blocking,
       so window.Telegram.WebApp is populated BEFORE the body boot script
       and BEFORE the deferred module bundle (main.jsx) run. Auth must
       never race the script injection; the onerror retry above covers
       the failure case only. -->
  <script src="https://telegram.org/js/telegram-web-app.js" onerror="window.__MG_retryTgScript && window.__MG_retryTgScript()"></script>

  <script>
    // WORKER 4 (ready ordering): signal Telegram ready() at the earliest
    // correct point — during boot parsing, BEFORE React's first render.
    // Previously the first ready() lived in useTelegram's useEffect
    // (post-commit), i.e. AFTER App's first render had already run the
    // synchronous isInTelegram() gate. ready() only announces "the app
    // has loaded"; calling it here (boot splash already painted) is
    // correct, and the later useTelegram ready() is a harmless repeat.
    try { if (typeof window.__MG_signalTgReady === 'function') window.__MG_signalTgReady() } catch (e) { /* noop */ }
    // WORKER 3 (auth speed): pre-warm the backend DURING HTML parsing —
    // before the JS bundle even downloads — so a sleeping Render
    // backend starts waking while the bundle loads instead of only
    // when the auth request fires (~seconds of head start on slow
    // networks). `https://visaenglish-backend.onrender.com` is substituted by Vite at build time;
    // if it is ever left literal (no env at build), the leading-%
    // guard skips the ping. no-cors: the wake does not need to read
    // the response, and a CORS-less /health must still reach the
    // server. Never throws, never blocks parsing.
    try {
      var __mgApi = 'https://visaenglish-backend.onrender.com';
      if (__mgApi && __mgApi.charAt(0) !== '%') {
        fetch(__mgApi.replace(/\/$/, '') + '/health', { mode: 'no-cors', cache: 'no-store', keepalive: true }).catch(function () {});
      }
    } catch (e) { /* never throw from the boot path */ }
    // SPLASH / BOOT FALLBACKS (worker 4 — timeouts / never-blank only).
    // Boot timestamp for the React splash budget.
    window.__MG_BOOT_T0 = Date.now();
    // Set to true by main.jsx the moment React starts rendering. The
    // fallbacks below key off it so they can never kill a live app.
    window.__MG_REACT_MOUNTED = false;
    (function () {
      var s = document.getElementById('boot-splash');
      if (!s) return;
      var failed = false;
      // Bundle-load failure UI: replaces the boot splash content with a
      // visible error + reload (never a white page). The #boot-splash
      // node itself is KEPT (same id) so React's SplashScreen can still
      // remove it if the bundle mounts late — a late mount clears this
      // error state instead of leaving it stuck.
      function showBootError() {
        if (failed) return;
        failed = true;
        try {
          s.innerHTML = '<div class="boot-inner">'
            + '<div class="boot-word">Mock<span>Grill</span></div>'
            + '<div class="boot-error-title">Couldn\u2019t load the app</div>'
            + '<p class="boot-error-text">The app files didn\u2019t finish loading. Check your connection and try again — your credits are safe.</p>'
            + '<button type="button" class="boot-error-btn" onclick="window.location.reload()">RELOAD APP</button>'
            + '<a class="boot-error-link" href="https://t.me/mockgrillbot">Open in Telegram</a>'
            + '</div>';
        } catch (e) { /* noop — never throw inside the fallback */ }
      }
      function removeBootSplash() {
        if (s.parentNode) s.parentNode.removeChild(s);
      }
      // 1) Resource-load failure (bundle 404 / chunk 404): capture-phase
      // error events fire on the failing <script>/<link> element. Only
      // SAME-ORIGIN scripts count — a Telegram CDN / font failure must
      // never nuke the app (the app degrades to WebLanding without them).
      // If React already mounted, React owns the screen — ignore.
      window.addEventListener('error', function (ev) {
        if (window.__MG_REACT_MOUNTED) return;
        var t = ev && ev.target;
        if (t && t.tagName === 'SCRIPT' && t.src) {
          try {
            if (new URL(t.src, window.location.href).origin === window.location.origin) showBootError();
          } catch (e) { /* unparsable src — ignore */ }
        }
      }, true);
      // 2) Uncaught runtime error before React mounts (e.g. syntax error
      // in the bundle): boot failed — show the error state instead of
      // hanging on the splash. A late React mount still clears it.
      window.onerror = function () {
        if (!window.__MG_REACT_MOUNTED) showBootError();
        return false; // let the error also reach the console
      };
      // 3) 1600ms checkpoint (was: unconditional removal — that left a
      // BLANK GAP on slow 3G when the bundle had not arrived yet). Now
      // it only removes the boot splash when React has actually mounted
      // (SplashScreen normally removes it itself; this is the fallback
      // if that removal failed). While the bundle is still loading the
      // boot splash HOLDS — no blank gap. This timer targets
      // #boot-splash ONLY; the React splash is a separate node
      // (.splash-screen) that only React unmounts via onDone, so this
      // fallback can never remove the React splash prematurely.
      setTimeout(function () {
        if (window.__MG_REACT_MOUNTED) removeBootSplash();
      }, 1600);
      // 4) Hard cap: if React still has not mounted after 15s the bundle
      // is hung/failed (slow-3G loads finish well before this; the React
      // splash's own 4s cap only starts AFTER mount). Show the error
      // state — never hang on the splash forever.
      setTimeout(function () {
        if (!window.__MG_REACT_MOUNTED) showBootError();
      }, 15000);
      setTimeout(function () {
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', '#FFFBF5');
      }, 1500);
    })();
  </script>
